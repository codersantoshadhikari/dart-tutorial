name: Update lesson list

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday 05:17 UTC
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild LESSONS.md from the live sites
        run: python scripts/update_lessons.py
      - name: Commit only if something changed
        run: |
          if git diff --quiet; then
            echo "No new lessons this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add LESSONS.md README.md
          git commit -m "Update lesson list"
          git push
