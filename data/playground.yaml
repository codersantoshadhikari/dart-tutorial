- title: "To-do list"
  track: flutter
  code: |
    import 'package:flutter/material.dart';

    void main() {
      runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: TodoPage()));
    }

    class TodoPage extends StatefulWidget {
      const TodoPage({super.key});

      @override
      State<TodoPage> createState() => _TodoPageState();
    }

    class _TodoPageState extends State<TodoPage> {
      final _controller = TextEditingController();
      final _todos = <String>['Learn Dart', 'Learn Flutter'];

      void _add() {
        final text = _controller.text.trim();
        if (text.isEmpty) return;
        setState(() => _todos.add(text));
        _controller.clear();
      }

      @override
      void dispose() {
        _controller.dispose();
        super.dispose();
      }

      @override
      Widget build(BuildContext context) {
        return Scaffold(
          appBar: AppBar(title: const Text('To-do')),
          body: Column(
            children: [
              Padding(
                padding: const EdgeInsets.all(16),
                child: Row(
                  children: [
                    Expanded(
                      child: TextField(
                        controller: _controller,
                        decoration: const InputDecoration(
                          hintText: 'New task',
                          border: OutlineInputBorder(),
                        ),
                        onSubmitted: (_) => _add(),
                      ),
                    ),
                    const SizedBox(width: 12),
                    FilledButton(onPressed: _add, child: const Text('Add')),
                  ],
                ),
              ),
              Expanded(
                child: ListView.builder(
                  itemCount: _todos.length,
                  itemBuilder: (context, i) => ListTile(
                    title: Text(_todos[i]),
                    trailing: IconButton(
                      icon: const Icon(Icons.delete_outline),
                      onPressed: () => setState(() => _todos.removeAt(i)),
                    ),
                  ),
                ),
              ),
            ],
          ),
        );
      }
    }

- title: "Profile card layout"
  track: flutter
  code: |
    import 'package:flutter/material.dart';

    void main() {
      runApp(
        MaterialApp(
          debugShowCheckedModeBanner: false,
          theme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal)),
          home: const Scaffold(body: Center(child: ProfileCard())),
        ),
      );
    }

    class ProfileCard extends StatelessWidget {
      const ProfileCard({super.key});

      @override
      Widget build(BuildContext context) {
        final theme = Theme.of(context);

        return ConstrainedBox(
          constraints: const BoxConstraints(maxWidth: 340),
          child: Card(
            child: Padding(
              padding: const EdgeInsets.all(20),
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  const CircleAvatar(radius: 36, child: Text('AR', style: TextStyle(fontSize: 22))),
                  const SizedBox(height: 12),
                  Text('Asha Rai', style: theme.textTheme.titleLarge),
                  Text('Flutter developer', style: theme.textTheme.bodyMedium),
                  const SizedBox(height: 16),
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                    children: const [
                      _Stat(label: 'Posts', value: '42'),
                      _Stat(label: 'Followers', value: '1.2k'),
                      _Stat(label: 'Following', value: '180'),
                    ],
                  ),
                  const SizedBox(height: 16),
                  SizedBox(
                    width: double.infinity,
                    child: FilledButton(onPressed: () {}, child: const Text('Follow')),
                  ),
                ],
              ),
            ),
          ),
        );
      }
    }

    class _Stat extends StatelessWidget {
      const _Stat({required this.label, required this.value});

      final String label;
      final String value;

      @override
      Widget build(BuildContext context) {
        return Column(
          children: [
            Text(value, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
            Text(label),
          ],
        );
      }
    }
