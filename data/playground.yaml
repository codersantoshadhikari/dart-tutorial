- title: "Lists: filter, total, highest"
  track: dart
  code: |
    void main() {
      final marks = [72, 45, 91, 38, 84];

      final passed = marks.where((m) => m >= 40).toList();
      final total = marks.fold(0, (sum, m) => sum + m);
      final highest = marks.reduce((a, b) => a > b ? a : b);

      print('Passed: $passed');
      print('Average: ${(total / marks.length).toStringAsFixed(1)}');
      print('Highest: $highest');
    }

- title: "Classes and objects"
  track: dart
  code: |
    class Account {
      Account(this.owner);

      final String owner;
      double _balance = 0;

      double get balance => _balance;

      void deposit(double amount) {
        if (amount <= 0) throw ArgumentError('Amount must be positive');
        _balance += amount;
      }
    }

    void main() {
      final account = Account('Asha')
        ..deposit(500)
        ..deposit(250);

      print('${account.owner} has ${account.balance}');
    }

