- title: "Records and switch"
  track: dart
  code: |
    (int min, int max) minMax(List<int> numbers) {
      var min = numbers.first;
      var max = numbers.first;
      for (final n in numbers) {
        if (n < min) min = n;
        if (n > max) max = n;
      }
      return (min, max);
    }

    String grade(int mark) => switch (mark) {
          >= 90 => 'A+',
          >= 80 => 'A',
          >= 60 => 'B',
          _ => 'C',
        };

    void main() {
      final (low, high) = minMax([72, 45, 91, 38, 84]);
      print('Lowest $low, highest $high');
      print('Grade for $high: ${grade(high)}');
    }

- title: "Counter app"
  track: flutter
  code: |
    import 'package:flutter/material.dart';

    void main() => runApp(const MyApp());

    class MyApp extends StatelessWidget {
      const MyApp({super.key});

      @override
      Widget build(BuildContext context) {
        return MaterialApp(
          debugShowCheckedModeBanner: false,
          theme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: Colors.blue)),
          home: const CounterPage(),
        );
      }
    }

    class CounterPage extends StatefulWidget {
      const CounterPage({super.key});

      @override
      State<CounterPage> createState() => _CounterPageState();
    }

    class _CounterPageState extends State<CounterPage> {
      int _count = 0;

      @override
      Widget build(BuildContext context) {
        return Scaffold(
          appBar: AppBar(title: const Text('Counter')),
          body: Center(
            child: Text('$_count', style: Theme.of(context).textTheme.displayLarge),
          ),
          floatingActionButton: FloatingActionButton(
            onPressed: () => setState(() => _count++),
            child: const Icon(Icons.add),
          ),
        );
      }
    }

